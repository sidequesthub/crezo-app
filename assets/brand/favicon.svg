<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <radialGradient id="electricGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0062FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0062FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3442" />
      <stop offset="100%" stop-color="#15171E" />
    </linearGradient>
  </defs>

  <!-- Squircle container matching Crezo dark mode aesthetic -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#borderStroke)" stroke-width="1.5" />

  <!-- Subtle ambient electric blue glow behind the glyph -->
  <circle cx="32" cy="32" r="24" fill="url(#electricGlow)" />

  <!-- Bold, optically centered 'C' in Plus Jakarta Sans 800 weight, solid crisp white -->
  <text x="32" y="45.5" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
        font-size="39" 
        font-weight="800" 
        letter-spacing="-1" 
        fill="#FFFFFF">C</text>
</svg>