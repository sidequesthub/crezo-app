<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="crezoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8EFF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
    <linearGradient id="subtleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2E39" />
      <stop offset="100%" stop-color="#181A20" />
    </linearGradient>
  </defs>

  <!-- App Icon Background: Pure Obsidian squircle with subtle ultra-refined bevel border -->
  <rect width="512" height="512" rx="116" fill="#0B0C0E" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#subtleStroke)" stroke-width="2" />

  <!-- Refined, elegant, minimalist 'C' mark -->
  <!-- A perfectly proportioned, sculpted arc with tapered optical geometry -->
  <path d="M 336 172 
           C 314 150 285 138 252 138 
           C 187 138 138 190 138 256 
           C 138 322 187 374 252 374 
           C 285 374 314 362 336 340" 
        fill="none" 
        stroke="url(#crezoBlue)" 
        stroke-width="44" 
        stroke-linecap="round" />

  <!-- Subtle inner luminous accent dot / spark in white placed with optical precision -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.9" />
</svg>