<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="crezoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8EFF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ADC6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4B8EFF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background / Container (Dark Obsidian Glass / Squircle) -->
  <rect width="512" height="512" rx="112" fill="#0D0E11" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#252932" stroke-width="3" />

  <!-- Background Ambient Radial Pulse -->
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#4B8EFF" stop-opacity="0.18" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />

  <!-- Monogram Mark: Interlocking geometric 'C' and 'Z' -->
  <g transform="translate(0, 0)">
    <!-- Outer Arc / Prismatic 'C' wrapping from top right around left to bottom right -->
    <!-- Bold, sculpted geometric strokes -->
    
    <!-- Top arm of C -->
    <path d="M 356 148 L 240 148 C 178 148 132 194 132 256 C 132 318 178 364 240 364 L 356 364" 
          fill="none" 
          stroke="url(#crezoGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sharp, high-contrast interlocking 'Z' woven through the center -->
    <!-- Top bar of Z -->
    <path d="M 220 206 L 332 206 L 212 306 L 332 306" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Electric Blue accent nodes on terminal ends -->
    <circle cx="356" cy="148" r="14" fill="#ADC6FF" filter="url(#subtleGlow)" />
    <circle cx="356" cy="364" r="14" fill="#ADC6FF" filter="url(#subtleGlow)" />
  </g>
</svg>